<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #root {
      box-sizing: border-box; height: 100%; padding: 6px 9px;
      display: flex; flex-direction: row; align-items: center; gap: 7px;
      background: rgba(32, 32, 34, 0.92);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
      font: 600 9px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: #e8e8ea;
      -webkit-user-select: none;
    }
    /* Which provider these bars belong to (Claude/Codex), driven by the Quota tab. */
    #provider { display: flex; align-items: center; justify-content: center; width: 16px; flex: none; }
    #provider svg { width: 16px; height: 16px; display: block; }
    #bars { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
    .row { display: flex; align-items: center; gap: 6px; }
    .label { width: 14px; color: #b4b4b8; }
    .track { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.13); overflow: hidden; }
    /* Surface is always dark, so the fill uses the dark-theme blue regardless of system theme. */
    .fill { height: 100%; border-radius: 4px; background: #3b82f6; width: 0%; transition: width 0.4s cubic-bezier(0.2, 0, 0, 1); }
    .pct { width: 26px; text-align: right; font-variant-numeric: tabular-nums; }
    .reset { width: 30px; text-align: right; color: #8a8a8e; font-variant-numeric: tabular-nums; }
    @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }

    /* macOS menu bar item (rendered offscreen, 124x22): no card, ink follows the
       menu bar's light/dark, fills color-coded by threshold like the tray icon. */
    body.mac { color-scheme: light dark; }
    body.mac #root {
      padding: 0 2px; gap: 5px; background: transparent; border: 0; border-radius: 0;
      font: 600 8.5px -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
      color: light-dark(#101012, #f5f5f7);
    }
    body.mac #provider, body.mac #provider svg { width: 14px; height: 14px; }
    body.mac #provider svg[fill] { fill: currentColor; } /* Codex glyph: ink, not fixed light gray */
    body.mac #bars { gap: 2px; }
    body.mac .row { gap: 4px; height: 9px; }
    body.mac .label { width: 11px; color: inherit; opacity: 0.7; }
    body.mac .track { height: 5px; border-radius: 2.5px; background: light-dark(rgba(0,0,0,0.16), rgba(255,255,255,0.22)); }
    body.mac .fill { border-radius: 2.5px; transition: none; background: #22c55e; }
    body.mac .fill[data-lvl="warn"] { background: #eab308; }
    body.mac .fill[data-lvl="hot"] { background: #ef4444; }
    body.mac .pct { width: 22px; }
    body.mac .reset { width: 16px; color: inherit; opacity: 0.6; }
</style>
</head>
<body>
  <div id="root">
    <div id="provider" title=""></div>
    <div id="bars">
      <!-- two rows = the selected provider's first two buckets (5h/7d for Claude & Codex, monthly for Copilot & Cursor) -->
      <div class="row"><span class="label" id="label-0">5h</span><div class="track" id="track-0" role="progressbar" aria-label="Session usage" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="fill-0"></div></div><span class="pct" id="pct-0">–</span><span class="reset" id="reset-0"></span></div>
      <div class="row"><span class="label" id="label-1">7d</span><div class="track" id="track-1" role="progressbar" aria-label="Weekly usage" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="fill-1"></div></div><span class="pct" id="pct-1">–</span><span class="reset" id="reset-1"></span></div>
    </div>
  </div>
  <script src="widget.js"></script>
</body>
</html>
