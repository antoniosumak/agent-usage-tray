name: release

# Release on merge: every push to master whose package.json version has no tag
# yet gets tagged vX.Y.Z, built for Windows + macOS, and published. A merge that
# does not bump the version is a no-op here.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already released, skipping"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$tag"
            git push origin "$tag"
            # Create the draft up front so both matrix builds upload into this one
            # release. Left to electron-builder, the two jobs race and each makes
            # its own draft; publish then flips only one of them live.
            gh release create "$tag" --draft --title "$tag" --notes "" --verify-tag
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: tag
    if: needs.tag.outputs.new == 'true'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # electron-builder uploads to a draft release named after package.json's
      # version (reliable for the large installer); the publish job flips it live
      # only after every asset has finished uploading.
      - if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # unsigned build: never look for a signing identity
          CSC_IDENTITY_AUTO_DISCOVERY: false

  publish:
    needs: [tag, build]
    if: needs.tag.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit ${{ needs.tag.outputs.tag }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
